            - paragraph [ref=e73]: Use the Place command or drag-and-drop to add files to your document.When you place a file, Photoshop adds it as a Smart Object, a special layer type that preserves the original file's quality. The placed file becomes a new layer that you can position, resize, and transform. This works with most Photoshop-supported formats, including JPEG, PNG, TIFF, PSD, and many others.
