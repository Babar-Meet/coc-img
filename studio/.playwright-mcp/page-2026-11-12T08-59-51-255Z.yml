                    - text: Props
                    - link "Link for Props":
                      - /url: "#common-props"
                  - paragraph [ref=f123e378]: "These special React props are supported for all built-in components:"
                  - list [ref=f123e379]:
                    - listitem [ref=f123e380]:
                      - paragraph [ref=f123e381]:
                        - code [ref=f123e382]: children
                        - text: ": A React node (an element, a string, a number,"
                        - link "a portal," [ref=f123e383] [cursor=pointer]:
                          - /url: /reference/react-dom/createPortal
                        - text: an empty node like
                        - code [ref=f123e384]: "null"
                        - text: ","
                        - code [ref=f123e385]: undefined
                        - text: and booleans, or an array of other React nodes). Specifies the content inside the component. When you use JSX, you will usually specify the
                        - code [ref=f123e386]: children
                        - text: prop implicitly by nesting tags like
                        - code [ref=f123e387]: <div><span /></div>
                        - text: .
                    - listitem [ref=f123e388]:
                      - paragraph [ref=f123e389]:
                        - code [ref=f123e390]: dangerouslySetInnerHTML
                        - text: ": An object of the form"
                        - code [ref=f123e391]: "{ __html: '<p>some html</p>' }"
                        - text: with a raw HTML string or
                        - link [ref=f123e392] [cursor=pointer]:
                          - /url: https://developer.mozilla.org/en-US/docs/Web/API/TrustedHTML
                          - code [ref=f123e393]: TrustedHTML
                        - text: value inside. Overrides the
                        - link [ref=f123e394] [cursor=pointer]:
                          - /url: https://developer.mozilla.org/en-US/docs/Web/API/Element/innerHTML
                          - code [ref=f123e395]: innerHTML
                        - text: property of the DOM node and displays the passed HTML inside. This should be used with extreme caution! If the HTML inside isn’t trusted (for example, if it’s based on user data), you risk introducing an
                        - link "XSS" [ref=f123e396] [cursor=pointer]:
                          - /url: https://en.wikipedia.org/wiki/Cross-site_scripting
                        - text: vulnerability.
                        - link [ref=f123e397] [cursor=pointer]:
                          - /url: "#dangerously-setting-the-inner-html"
                          - text: Read more about using
                          - code [ref=f123e398]: dangerouslySetInnerHTML
                          - text: .
                    - listitem [ref=f123e399]:
                      - paragraph [ref=f123e400]:
                        - code [ref=f123e401]: ref
                        - text: ": A ref object from"
                        - link [ref=f123e402] [cursor=pointer]:
                          - /url: /reference/react/useRef
                          - code [ref=f123e403]: useRef
                        - text: or
                        - link [ref=f123e404] [cursor=pointer]:
                          - /url: /reference/react/createRef
                          - code [ref=f123e405]: createRef
                        - text: ", or a"
                        - link [ref=f123e406] [cursor=pointer]:
                          - /url: "#ref-callback"
                          - code [ref=f123e407]: ref
                          - text: callback function,
                        - text: or a string for
                        - link "legacy refs." [ref=f123e408] [cursor=pointer]:
                          - /url: https://reactjs.org/docs/refs-and-the-dom.html#legacy-api-string-refs
                        - text: Your ref will be filled with the DOM element for this node.
                        - link "Read more about manipulating the DOM with refs." [ref=f123e409] [cursor=pointer]:
                          - /url: "#manipulating-a-dom-node-with-a-ref"
                    - listitem [ref=f123e410]:
                      - paragraph [ref=f123e411]:
                        - code [ref=f123e412]: suppressContentEditableWarning
                        - text: ": A boolean. If"
                        - code [ref=f123e413]: "true"
                        - text: ", suppresses the warning that React shows for elements that both have"
                        - code [ref=f123e414]: children
                        - text: and
                        - code [ref=f123e415]: "contentEditable={true}"
                        - text: (which normally do not work together). Use this if you’re building a text input library that manages the
                        - code [ref=f123e416]: contentEditable
                        - text: content manually.
                    - listitem [ref=f123e417]:
                      - paragraph [ref=f123e418]:
                        - code [ref=f123e419]: suppressHydrationWarning
                        - text: ": A boolean. If you use"
                        - link "server rendering," [ref=f123e420] [cursor=pointer]:
                          - /url: /reference/react-dom/server
                        - text: normally there is a warning when the server and the client render different content. In some rare cases (like timestamps), it is very hard or impossible to guarantee an exact match. If you set
                        - code [ref=f123e421]: suppressHydrationWarning
                        - text: to
                        - code [ref=f123e422]: "true"
                        - text: ", React will not warn you about mismatches in the attributes and the content of that element. It only works one level deep, and is intended to be used as an escape hatch. Don’t overuse it."
                        - link "Read about suppressing hydration errors." [ref=f123e423] [cursor=pointer]:
                          - /url: /reference/react-dom/client/hydrateRoot#suppressing-unavoidable-hydration-mismatch-errors
                    - listitem [ref=f123e424]:
                      - paragraph [ref=f123e425]:
                        - code [ref=f123e426]: style
                        - text: ": An object with CSS styles, for example"
                        - code [ref=f123e427]: "{ fontWeight: 'bold', margin: 20 }"
                        - text: . Similarly to the DOM
                        - link [ref=f123e428] [cursor=pointer]:
                          - /url: https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/style
                          - code [ref=f123e429]: style
                        - text: property, the CSS property names need to be written as
                        - code [ref=f123e430]: camelCase
                        - text: ", for example"
                        - code [ref=f123e431]: fontWeight
                        - text: instead of
                        - code [ref=f123e432]: font-weight
                        - text: . You can pass strings or numbers as values. If you pass a number, like
                        - code [ref=f123e433]: "width: 100"
                        - text: ", React will automatically append"
                        - code [ref=f123e434]: px
                        - text: (“pixels”) to the value unless it’s a
                        - link "unitless property." [ref=f123e435] [cursor=pointer]:
                          - /url: https://github.com/react/react/blob/81d4ee9ca5c405dce62f64e61506b8e155f38d8d/packages/react-dom-bindings/src/shared/CSSProperty.js#L8-L57
                        - text: We recommend using
                        - code [ref=f123e436]: style
                        - text: only for dynamic styles where you don’t know the style values ahead of time. In other cases, applying plain CSS classes with
                        - code [ref=f123e437]: className
                        - text: is more efficient.
                        - link [ref=f123e438] [cursor=pointer]:
                          - /url: "#applying-css-styles"
                          - text: Read more about
                          - code [ref=f123e439]: className
                          - text: and
                          - code [ref=f123e440]: style
                          - text: .
                  - paragraph [ref=f123e441]: "These standard DOM props are also supported for all built-in components:"
                  - list [ref=f123e442]:
                    - listitem [ref=f123e443]:
                      - link [ref=f123e444] [cursor=pointer]:
                        - /url: https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/accesskey
                        - code [ref=f123e445]: accessKey
                      - text: ": A string. Specifies a keyboard shortcut for the element."
                      - link "Not generally recommended." [ref=f123e446] [cursor=pointer]:
                        - /url: https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/accesskey#accessibility_concerns
                    - listitem [ref=f123e447]:
                      - link [ref=f123e448] [cursor=pointer]:
                        - /url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Attributes
                        - code [ref=f123e449]: aria-*
                      - text: ": ARIA attributes let you specify the accessibility tree information for this element. See"
                      - link "ARIA attributes" [ref=f123e450] [cursor=pointer]:
                        - /url: https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Attributes
                      - text: for a complete reference. In React, all ARIA attribute names are exactly the same as in HTML.
                    - listitem [ref=f123e451]:
                      - link [ref=f123e452] [cursor=pointer]:
                        - /url: https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/autocapitalize
                        - code [ref=f123e453]: autoCapitalize
                      - text: ": A string. Specifies whether and how the user input should be capitalized."
                    - listitem [ref=f123e454]:
                      - link [ref=f123e455] [cursor=pointer]:
                        - /url: https://developer.mozilla.org/en-US/docs/Web/API/Element/className
                        - code [ref=f123e456]: className
                      - text: ": A string. Specifies the element’s CSS class name."
                      - link "Read more about applying CSS styles." [ref=f123e457] [cursor=pointer]:
                        - /url: "#applying-css-styles"
                    - listitem [ref=f123e458]:
                      - link [ref=f123e459] [cursor=pointer]:
                        - /url: https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/contenteditable
                        - code [ref=f123e460]: contentEditable
                      - text: ": A boolean. If"
                      - code [ref=f123e461]: "true"
                      - text: ", the browser lets the user edit the rendered element directly. This is used to implement rich text input libraries like"
                      - link "Lexical." [ref=f123e462] [cursor=pointer]:
                        - /url: https://lexical.dev/
                      - text: React warns if you try to pass React children to an element with
                      - code [ref=f123e463]: "contentEditable={true}"
                      - text: because React will not be able to update its content after user edits.
                    - listitem [ref=f123e464]:
                      - link [ref=f123e465] [cursor=pointer]:
                        - /url: https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/data-*
                        - code [ref=f123e466]: data-*
                      - text: ": Data attributes let you attach some string data to the element, for example"
                      - code [ref=f123e467]: data-fruit="banana"
                      - text: . In React, they are not commonly used because you would usually read data from props or state instead.
