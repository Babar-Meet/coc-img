        - paragraph [ref=f131e458]:
          - text: While the specification does not limit the
          - code [ref=f131e459]: cursor
          - text: image size,
          - link "user agents" [ref=f131e460] [cursor=pointer]:
            - /url: /en-US/docs/Glossary/User_agent
          - text: commonly restrict them to avoid potential misuse. For example, on Firefox and Chromium cursor images are restricted to 128x128 pixels by default, but it is recommended to limit the cursor image size to 32x32 pixels. Cursor changes using images that are larger than the user-agent maximum supported size will generally just be ignored.
      - region "Supported image file formats" [ref=f131e461]:
        - heading [level=3] [ref=f131e462]:
          - link "Supported image file formats" [ref=f131e463] [cursor=pointer]:
            - /url: "#supported_image_file_formats"
        - paragraph [ref=f131e464]:
          - text: User agents are required by the specification to support PNG files, SVG v1.1 files in secure static mode that contain a natural size, and any other non-animated image file formats that they support for images in other properties. Desktop browsers also broadly support the
          - code [ref=f131e465]: .cur
          - text: file format.
        - paragraph [ref=f131e466]:
          - text: The specification further indicates that user agents
          - emphasis [ref=f131e467]: should
          - text: also support SVG v1.1 files in secure animated mode that contain a natural size, along with any other animated images file formats they support for images in other properties. User agents
          - emphasis [ref=f131e468]: may
          - text: support both static and animated SVG images that do not contain a natural size.
      - region "iPadOS" [ref=f131e469]:
        - heading [level=3] [ref=f131e470]:
          - link "iPadOS" [ref=f131e471] [cursor=pointer]:
            - /url: "#ipados"
        - paragraph [ref=f131e472]:
          - text: iPadOS supports pointer devices like trackpads and mouses. By default, the iPad cursor is displayed as a circle, and the only supported value that will change an appearance of the pointer is
          - code [ref=f131e473]: text
          - text: .
      - region "Other notes" [ref=f131e474]:
        - heading [level=3] [ref=f131e475]:
          - link "Other notes" [ref=f131e476] [cursor=pointer]:
            - /url: "#other_notes"
        - paragraph [ref=f131e477]: Cursor changes that intersect toolbar areas are commonly blocked to avoid spoofing.
