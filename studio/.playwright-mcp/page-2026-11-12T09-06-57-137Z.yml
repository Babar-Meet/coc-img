      - region "Getting a file representing the canvas" [ref=f138e155]:
        - heading [level=3] [ref=f138e156]:
          - link "Getting a file representing the canvas" [ref=f138e157] [cursor=pointer]:
            - /url: "#getting_a_file_representing_the_canvas"
        - paragraph [ref=f138e158]:
          - text: Once you have drawn content into a canvas, you can convert it into a file of any supported image format. The code snippet below, for example, takes the image in the
          - link [ref=f138e159] [cursor=pointer]:
            - /url: /en-US/docs/Web/HTML/Reference/Elements/canvas
            - code [ref=f138e160]: <canvas>
          - text: element whose ID is "canvas", obtains a copy of it as a PNG image, then appends a new
          - link [ref=f138e161] [cursor=pointer]:
            - /url: /en-US/docs/Web/HTML/Reference/Elements/img
            - code [ref=f138e162]: <img>
          - text: element to the document, whose source image is the one created using the canvas.
        - generic [ref=f138e164]:
          - generic [ref=f138e165]:
            - generic [ref=f138e166]: js
            - button "Copy" [ref=f138e169] [cursor=pointer]
          - code [ref=f138e172]: "const canvas = document.getElementById(\"canvas\"); canvas.toBlob((blob) => { const newImg = document.createElement(\"img\"); const url = URL.createObjectURL(blob); newImg.src = url; document.body.appendChild(newImg); });"
        - paragraph [ref=f138e173]:
          - text: Note that here we're creating a PNG image; if you add a second parameter to the
          - code [ref=f138e174]: toBlob()
          - text: "call, you can specify another image type supported by the user agent. For example, to get the image in JPEG format:"
        - generic [ref=f138e176]:
          - generic [ref=f138e177]:
            - generic [ref=f138e178]: js
            - button "Copy" [ref=f138e181] [cursor=pointer]
          - code [ref=f138e184]: "canvas.toBlob( (blob) => { /* … */ }, \"image/jpeg\", 0.95, ); // JPEG at 95% quality"
        - paragraph [ref=f138e185]:
          - text: Note that we don't immediately revoke the object URL after the image has loaded, because doing so would make the image unusable for user interactions (such as right-clicking to save the image or opening it in a new tab). For long-lived applications, you should revoke object URLs when they're no longer needed (such as when the image is removed from the DOM) to free up memory by calling the
          - link [ref=f138e186] [cursor=pointer]:
            - /url: /en-US/docs/Web/API/URL/revokeObjectURL_static
            - code [ref=f138e187]: URL.revokeObjectURL()
          - text: method and passing in the object URL string.
