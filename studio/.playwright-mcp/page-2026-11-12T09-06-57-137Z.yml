        - paragraph [ref=f138e68]:
          - text: The
          - strong [ref=f138e69]:
            - code [ref=f138e70]: HTMLCanvasElement.toBlob()
          - text: method creates a
          - link [ref=f138e71] [cursor=pointer]:
            - /url: /en-US/docs/Web/API/Blob
            - code [ref=f138e72]: Blob
          - text: object representing the image contained in the canvas. This file may be cached on the disk or stored in memory at the discretion of the user agent.
        - paragraph [ref=f138e73]:
          - text: The desired file format and image quality may be specified. If the file format is not specified, or if the given format is not supported, then the data will be exported as
          - code [ref=f138e74]: image/png
          - text: . Browsers are required to support
          - code [ref=f138e75]: image/png
          - text: ; many will support additional formats including
          - code [ref=f138e76]: image/jpeg
          - text: and
          - code [ref=f138e77]: image/webp
          - text: .
        - paragraph [ref=f138e78]: The created image will have a resolution of 96dpi for file formats that support encoding resolution metadata.
