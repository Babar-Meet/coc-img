              - /url: "#pan-x"
              - code [ref=f119e163]: pan-x
          - definition [ref=f119e164]:
            - paragraph [ref=f119e165]:
              - text: Enable single-finger horizontal panning gestures. May be combined with
              - strong [ref=f119e166]: pan-y
              - text: ","
              - strong [ref=f119e167]: pan-up
              - text: ","
              - strong [ref=f119e168]: pan-down
              - text: and/or
