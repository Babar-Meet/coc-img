      - generic [ref=f119e71]:
        - paragraph [ref=f119e72]:
          - text: The
          - strong [ref=f119e73]:
            - code [ref=f119e74]: touch-action
          - link "CSS" [ref=f119e75] [cursor=pointer]:
            - /url: /en-US/docs/Web/CSS
          - text: property sets how an element's region can be manipulated by a touchscreen user (for example, by zooming features built into the browser).
        - paragraph [ref=f119e76]:
          - text: By default, panning (scrolling) and pinching gestures are handled exclusively by the browser. An application using
          - link "Pointer events" [ref=f119e77] [cursor=pointer]:
            - /url: /en-US/docs/Web/API/Pointer_events
          - text: will receive a
          - link [ref=f119e78] [cursor=pointer]:
            - /url: /en-US/docs/Web/API/Element/pointercancel_event
            - code [ref=f119e79]: pointercancel
          - text: event when the browser starts handling a touch gesture. By explicitly specifying which gestures should be handled by the browser, an application can supply its own behavior in
          - link [ref=f119e80] [cursor=pointer]:
            - /url: /en-US/docs/Web/API/Element/pointermove_event
            - code [ref=f119e81]: pointermove
          - text: and
          - link [ref=f119e82] [cursor=pointer]:
            - /url: /en-US/docs/Web/API/Element/pointerup_event
            - code [ref=f119e83]: pointerup
          - text: listeners for the remaining gestures. Applications using
          - link "Touch events" [ref=f119e84] [cursor=pointer]:
            - /url: /en-US/docs/Web/API/Touch_events
          - text: disable the browser handling of gestures by calling
          - link [ref=f119e85] [cursor=pointer]:
            - /url: /en-US/docs/Web/API/Event/preventDefault
            - code [ref=f119e86]: preventDefault()
          - text: ", but should also use"
          - code [ref=f119e87]: touch-action
          - text: to ensure the browser knows the intent of the application before any event listeners have been invoked.
        - paragraph [ref=f119e88]:
          - text: When a gesture is started, the browser intersects the
          - code [ref=f119e89]: touch-action
          - text: values of the touched element and its ancestors, up to the one that implements the gesture (in other words, the first containing scrolling element). This means that in practice,
          - code [ref=f119e90]: touch-action
          - text: is typically applied only to top-level elements which have some custom behavior, without needing to specify
          - code [ref=f119e91]: touch-action
          - text: explicitly on any of that element's descendants.
        - paragraph [ref=f119e93]:
          - strong [ref=f119e94]: "Note:"
          - text: After a gesture starts, changes to
          - code [ref=f119e95]: touch-action
          - text: will not have any impact on the behavior of the current gesture.
