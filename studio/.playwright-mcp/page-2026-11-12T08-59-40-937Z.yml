              - code [ref=f119e172]: pan-y
          - definition [ref=f119e173]:
            - paragraph [ref=f119e174]:
              - text: Enable single-finger vertical panning gestures. May be combined with
              - strong [ref=f119e175]: pan-x
              - text: ","
              - strong [ref=f119e176]: pan-left
              - text: ","
              - strong [ref=f119e177]: pan-right
              - text: and/or
              - strong [ref=f119e178]: pinch-zoom
              - text: .
          - term [ref=f119e179]:
            - link [ref=f119e180] [cursor=pointer]:
              - /url: "#manipulation"
              - code [ref=f119e181]: manipulation
          - definition [ref=f119e182]:
            - paragraph [ref=f119e183]:
              - text: Enable panning and pinch zoom gestures, but disable additional non-standard gestures such as double-tap to zoom. Disabling double-tap to zoom removes the need for browsers to delay the generation of
              - strong [ref=f119e184]: click
              - text: events when the user taps the screen. This is an alias for "
              - strong [ref=f119e185]: pan-x pan-y pinch-zoom
              - text: "\" (which, for compatibility, is itself still valid)."
          - term [ref=f119e186]:
            - link [ref=f119e187] [cursor=pointer]:
              - /url: "#pan-left"
              - code [ref=f119e188]: pan-left
              - text: ","
              - code [ref=f119e189]: pan-right
              - text: ","
              - code [ref=f119e190]: pan-up
              - text: ","
              - code [ref=f119e191]: pan-down
          - definition [ref=f119e192]:
            - paragraph [ref=f119e193]:
              - text: Enable single-finger gestures that begin by scrolling in the given direction(s). Once scrolling has started, the direction may still be reversed. Note that scrolling "up" (
              - strong [ref=f119e194]: pan-up
              - text: ) means that the user is dragging their finger downward on the screen surface, and likewise
              - strong [ref=f119e195]: pan-left
              - text: means the user is dragging their finger to the right. Multiple directions may be combined except when there is a simpler representation (for example,
              - strong [ref=f119e196]: "\"pan-left pan-right"
              - text: "\" is invalid since \""
              - strong [ref=f119e197]: pan-x
              - text: "\" is simpler, but \""
              - strong [ref=f119e198]: pan-left pan-down
              - text: "\" is valid)."
          - term [ref=f119e199]:
            - link [ref=f119e200] [cursor=pointer]:
              - /url: "#pinch-zoom"
              - code [ref=f119e201]: pinch-zoom
          - definition [ref=f119e202]:
            - paragraph [ref=f119e203]:
              - text: Enable multi-finger panning and zooming of the page. This may be combined with any of the
              - strong [ref=f119e204]: pan-
              - text: values.
